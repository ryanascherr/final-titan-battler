<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./scss/main.css">
    <!-- <link rel="icon" type="image/png" href="./img/wallpaper/fav-icon.png"> -->
    <title>Final Titan Battler</title>
</head>
<body>
    <div class="setup">
        <div class="setup__select-container">
            <div class="setup__select">
                <label for="titan-select">Choose a Titan (Player 1):</label>
                <select name="titan-select" id="titan-select"></select>
            </div>
            <div class="setup__select">
                <label for="challenger-select">Choose a Titan (Player 2):</label>
                <select name="challenger-select" id="challenger-select"></select>
            </div>
        </div>
        <button class="js_select-champions btn btn--lg">Select Champions</button>
    </div>
    <div class="fight-container js_fight-container hide">
        <div class="champion-container champion-container--align-right js_titan-container">
            <h2>Titan</h2>
            <img class="champion-holder__card js_titan-card" src="">
            <div class="roll-container">
                <img class="champion-holder__charge js_titan-charge" src="./img/icons/icon_charge.png" alt="">
                <div class="cube js_titan-die js_titan-roll-btn face-1-low low roll-btn">
                    <div class="face front">
                        <img src="./img/icons/icon_attack_blue.png">
                    </div>
                    <div class="face back"></div>
                    <div class="face bottom">
                        <img src="./img/icons/icon_attack_green.png">
                    </div>
                    <div class="face left">
                        <img src="./img/icons/icon_attack_yellow.png">
                    </div>
                    <div class="face right">
                        <img src="./img/icons/icon_attack_red.png">
                    </div>
                    <div class="face top">
                        <img src="./img/icons/icon_charge.png">
                    </div>
                </div>
            </div>
            <div class="champion-holder__health js_titan-health"></div>
            <div class="champion-holder__ultimate js_titan-ultimate"></div>
            <div class="champion-holder__tokens js_titan-tokens">
                <div class="champion-holder__tokens-action js_titan-tokens-action"></div>
                <div class="champion-holder__tokens-armor js_titan-tokens-armor"></div>
                <div class="champion-holder__tokens-dodge js_titan-tokens-dodge"></div>
                <div class="champion-holder__tokens-poison js_titan-tokens-poison"></div>
                <div class="champion-holder__tokens-power js_titan-tokens-power"></div>
            </div>
        </div>
        <div class="champion-container champion-container--align-left js_challenger-container">
            <h2>Challenger</h2>
            <img class="champion-holder__card js_challenger-card" src="">
            <div class="roll-container">
                <div class="cube js_challenger-die js_challenger-roll-btn face-2-low low roll-btn">
                    <div class="face front">
                        <img src="./img/icons/icon_attack_blue.png">
                    </div>
                    <div class="face back"></div>
                    <div class="face bottom">
                        <img src="./img/icons/icon_attack_green.png">
                    </div>
                    <div class="face left">
                        <img src="./img/icons/icon_attack_yellow.png">
                    </div>
                    <div class="face right">
                        <img src="./img/icons/icon_attack_red.png">
                    </div>
                    <div class="face top">
                        <img src="./img/icons/icon_charge.png">
                    </div>
                </div>
                <img class="champion-holder__charge js_challenger-charge" src="./img/icons/icon_charge.png" alt="">
            </div>
            <div class="champion-holder__health js_challenger-health"></div>
            <div class="champion-holder__ultimate js_challenger-ultimate"></div>
            <div class="champion-holder__tokens js_challenger-tokens">
                <div class="champion-holder__tokens-action js_challenger-tokens-action"></div>
                <div class="champion-holder__tokens-armor js_challenger-tokens-armor"></div>
                <div class="champion-holder__tokens-dodge js_challenger-tokens-dodge"></div>
                <div class="champion-holder__tokens-poison js_challenger-tokens-poison"></div>
                <div class="champion-holder__tokens-power js_challenger-tokens-power"></div>
            </div>
        </div>
    </div>
    <!-- <div class="champion-container__btn-container js_start-fight-btn-container hide">
        <button class="js_start-fight-btn btn btn--lg">Start Fight</button>
    </div> -->
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="./scripts/script.js"></script>
</body>
</html>
