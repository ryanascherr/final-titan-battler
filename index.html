<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./scss/main.css">
    <!-- <link rel="icon" type="image/png" href="./img/wallpaper/fav-icon.png"> -->
    <title>Final Titan Battler</title>
</head>
<body>
    <div class="setup">
        <label for="titan-select">Choose a Titan:</label>
        <select name="titan-select" id="titan-select">
        </select>
        <label for="challenger-select">Choose a Titan:</label>
        <select name="challenger-select" id="challenger-select">
        </select>
        <button class="js_select-champions">Select Champions</button>
    </div>
    <div class="fight-container js_fight-container">
        <div class="champion-container js_titan-container">
            <div class="champion-holder__health js_titan-health"></div>
            <div class="champion-holder__ultimate js_titan-ultimate"></div>
            <div class="champion-holder__tokens js_titan-tokens">
                <div class="champion-holder__tokens-action js_titan-tokens-action"></div>
                <div class="champion-holder__tokens-armor js_titan-tokens-armor"></div>
                <div class="champion-holder__tokens-dodge js_titan-tokens-dodge"></div>
                <div class="champion-holder__tokens-poison js_titan-tokens-poison"></div>
                <div class="champion-holder__tokens-power js_titan-tokens-power"></div>
            </div>
            <img class="champion-holder__charge js_titan-charge" src="./img/icons/icon_charge.png" alt="">
            <button class="champion-holder__btn js_titan-roll-btn">Roll</button>
        </div>
        <div class="champion-container js_challenger-container">
            <div class="champion-holder__health js_challenger-health"></div>
            <div class="champion-holder__ultimate js_challenger-ultimate"></div>
            <div class="champion-holder__tokens js_challenger-tokens">
                <div class="champion-holder__tokens-action js_challenger-tokens-action"></div>
                <div class="champion-holder__tokens-armor js_challenger-tokens-armor"></div>
                <div class="champion-holder__tokens-dodge js_challenger-tokens-dodge"></div>
                <div class="champion-holder__tokens-poison js_challenger-tokens-poison"></div>
                <div class="champion-holder__tokens-power js_challenger-tokens-power"></div>
            </div>
            <img class="champion-holder__charge js_challenger-charge" src="./img/icons/icon_charge.png" alt="">
            <button class="champion-holder__btn js_challenger-roll-btn">Roll</button>
        </div>
    </div>
    <div class="champion-container__btn-container">
        <button class="js_start-fight-btn">Start Fight</button>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script type="module" src="./scripts/script.js"></script>
</body>
</html>
